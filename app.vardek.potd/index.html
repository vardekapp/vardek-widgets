<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Picture of the Day</title>
<!--
THESIS: A daily photograph is a proof pulled fresh off the wire, not a hero
banner — the frame around it does the crediting, so the image itself stays
clean.
OWN-WORLD: Cockpit Tokyo Night darkroom — flat near-black ground, a hairline
photo frame with corner mount brackets in indigo, a top-edge film-perforation
strip, SF Mono for frame/date metadata, sans for headline and caption.
STORY: user glances at today's featured Commons photo full-frame on the
left, reads title/photographer/license/caption in a proof-sheet column on
the right, taps to open the full-resolution Commons page.
FIRST VIEWPORT: full 2560×720 panel; top edge carries a thin perforation
strip; left ~62% is the framed photograph (contain, hairline border, corner
brackets); right ~38% is a vertical proof-sheet column: source line,
headline, credit, license pill, caption, date/frame stamp.
FORM: Darkroom Contact Sheet, candidate 7/7 on the surface's own
resonance-ordered list, seed 1f4d4e65.
FINISH: unreviewed and undocumented is unfinished; this build ends with the
finish review, the verdict, and DESIGN.md.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  #panel {
    position: relative; width: 100vw; height: 100vh;
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    color: #e6e9ef;
    display: flex; flex-direction: column;
  }

  #perf { display: flex; gap: 1.2vw; padding: 1.4vh 4vw 0; }
  #perf .hole { width: 8px; height: 8px; border-radius: 2px; background: #171b28; flex: 0 0 auto; }

  #body { flex: 1; display: flex; min-height: 0; margin: 1.6vh 4vw 2vh; gap: 3vw; }

  #frame { position: relative; flex: 0 0 60%; display: flex; align-items: center; justify-content: center;
    cursor: pointer; outline: none; }
  #frame .mount { position: relative; max-width: 100%; max-height: 100%;
    border: 1px solid rgba(255,255,255,.14); background: #05070a; }
  #frame img { display: block; max-width: 100%; max-height: calc(100vh - 12vh); object-fit: contain; }
  #frame .corner { position: absolute; width: 18px; height: 18px; border: 2px solid #7aa2f7; opacity: .85; }
  #frame .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
  #frame .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
  #frame .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
  #frame .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
  #frame:focus-visible .corner { border-color: #e0af68; }

  #detail { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column;
    border-left: 1px solid rgba(255,255,255,.1); padding-left: 3vw; }
  .source { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    font-size: 14px; font-weight: 600; letter-spacing: .08em; color: #565f89; }
  .headline { margin-top: 1.4vh; font-weight: 700; font-size: clamp(1.2rem, 1.7vw, 1.6rem);
    line-height: 1.25; color: #e6e9ef;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .credit { margin-top: 1.2vh; font-size: 16px; font-weight: 600; color: #c0caf5; }
  .credit span { color: #8089a6; font-weight: 400; }
  .license { margin-top: 1vh; display: inline-flex; align-self: flex-start; align-items: center;
    border: 1px solid rgba(255,255,255,.16); border-radius: 20px; padding: 3px 10px;
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    font-size: 14px; font-weight: 600; color: #8089a6; letter-spacing: .04em; }
  .desc { margin-top: 1.8vh; font-size: 16px; line-height: 1.5; color: #a9b1c6;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .spacer { flex: 1; }
  .stamp { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    font-size: 14px; font-weight: 600; letter-spacing: .08em; color: #565f89;
    border-top: 1px solid rgba(255,255,255,.1); padding-top: 1.2vh; margin-top: 1.4vh;
    display: flex; justify-content: space-between; }

  #centered { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #565f89; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    font-size: 14px; text-align: center; letter-spacing: .08em; }
</style>
</head>
<body>
<div id="panel">
  <div id="perf"></div>
  <div id="body">
    <div id="frame" tabindex="0" role="link" aria-label="Open full resolution on Wikimedia Commons">
      <div class="mount">
        <img id="photo" alt="">
        <span class="corner tl"></span><span class="corner tr"></span>
        <span class="corner bl"></span><span class="corner br"></span>
      </div>
    </div>
    <div id="detail">
      <div class="source">WIKIPEDIA · PICTURE OF THE DAY</div>
      <div class="headline" id="headline"></div>
      <div class="credit" id="credit"></div>
      <div class="license" id="license"></div>
      <div class="desc" id="desc"></div>
      <div class="spacer"></div>
      <div class="stamp"><span id="dateStamp"></span><span>TAP FOR FULL RESOLUTION</span></div>
    </div>
  </div>
</div>
<script src="potd.js"></script>
<script type="module">
  import { xemd, escapeHtml } from '/sdk/widget-sdk.js';

  const perf = document.getElementById("perf");
  const frame = document.getElementById("frame");
  const photo = document.getElementById("photo");
  const headline = document.getElementById("headline");
  const credit = document.getElementById("credit");
  const license = document.getElementById("license");
  const desc = document.getElementById("desc");
  const dateStamp = document.getElementById("dateStamp");
  const panel = document.getElementById("panel");

  const defaults = { lang: "en" };
  let cfg = Object.assign({}, defaults);
  let current = null;
  let errorMsg = null;

  for (let i = 0; i < 90; i++) {
    const h = document.createElement("span");
    h.className = "hole";
    perf.appendChild(h);
  }

  function showError(msg) {
    let el = document.getElementById("centered");
    if (!el) {
      el = document.createElement("div");
      el.id = "centered";
      panel.appendChild(el);
    }
    el.textContent = msg;
    document.getElementById("body").style.visibility = "hidden";
  }

  function clearError() {
    const el = document.getElementById("centered");
    if (el) el.remove();
    document.getElementById("body").style.visibility = "visible";
  }

  function render() {
    if (errorMsg || !current) {
      showError(errorMsg || "DEVELOPING…");
      return;
    }
    clearError();
    photo.src = current.thumbSrc;
    photo.alt = current.headline;
    headline.textContent = current.headline;
    credit.innerHTML = current.artist
      ? `<span>PHOTO BY</span> ${escapeHtml(current.artist)}`
      : "";
    license.textContent = current.license || "COMMONS";
    desc.textContent = current.description;
    frame.dataset.url = current.filePage || "";
  }

  async function fetchFor(lang, date) {
    const path = Potd.datePath(date);
    const res = await xemd.proxy.fetch(`https://${lang}.wikipedia.org/api/rest_v1/feed/featured/${path}`);
    if (!res.ok) return null;
    return Potd.parseFeatured(await res.json(), lang);
  }

  async function refresh() {
    const lang = Potd.sanitizeLang(cfg.lang);
    try {
      const today = new Date();
      let parsed = await fetchFor(lang, today);
      let usedDate = today;
      if (!parsed) {
        const yesterday = new Date(today);
        yesterday.setUTCDate(yesterday.getUTCDate() - 1);
        parsed = await fetchFor(lang, yesterday);
        usedDate = yesterday;
      }
      if (!parsed) { errorMsg = "NO PRINT TODAY"; current = null; render(); return; }
      current = parsed;
      errorMsg = null;
      dateStamp.textContent = usedDate.toISOString().slice(0, 10).replace(/-/g, ".");
    } catch (err) {
      errorMsg = "DARKROOM — OFFLINE";
      current = null;
    }
    render();
  }

  function openFrame() {
    if (frame.dataset.url) xemd.openLink(frame.dataset.url);
  }
  frame.addEventListener("click", openFrame);
  frame.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openFrame(); }
  });
  photo.addEventListener("error", () => {
    if (current) { errorMsg = "DARKROOM — OFFLINE"; render(); }
  });

  xemd.settings.get().then((s) => {
    cfg = Object.assign({}, defaults, s);
    render();
    refresh();
  });

  xemd.onRefresh(refresh);
  xemd.onSettingsChange((s) => {
    cfg = Object.assign({}, defaults, s);
    refresh();
  });

  xemd.ready();
</script>
</body>
</html>
