<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #board { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="board" width="1280" height="720"></canvas>
<script src="launches.js"></script>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';

  const W = 1280, H = 720;
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const { parseLaunches, formatCountdown } = globalThis.Launches;

  const ACCENTS = ["#7aa2f7", "#3ad16b", "#ffd60a", "#ff9f0a", "#bf5af2", "#5ac8fa"];

  const defaults = { count: "5" };
  let cfg = Object.assign({}, defaults);
  let launches = [];
  let errorMsg = null;
  let loading = true;

  function buildUrl() {
    return "https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=" + parseInt(cfg.count) + "&mode=list";
  }

  function drawBg() {
    ctx.clearRect(0, 0, W, H);
  }

  function drawCentered(text) {
    ctx.font = "22px -apple-system, 'Helvetica Neue', sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#8089a6";
    ctx.fillText(text, W / 2, H / 2);
  }

  // Truncate `text` with an ellipsis so it fits within `maxWidth` at the
  // current ctx.font. Assumes ctx.textAlign is already set by the caller.
  function truncate(text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (ctx.measureText(text.slice(0, mid) + "…").width <= maxWidth) lo = mid;
      else hi = mid - 1;
    }
    return lo > 0 ? text.slice(0, lo) + "…" : "…";
  }

  function countdownColor(remaining) {
    if (remaining <= 0) return "#3ad16b";
    const hours = remaining / 3600000;
    if (hours < 1) return "#ff453a";
    if (hours < 24) return "#ffd60a";
    return "#7aa2f7";
  }

  function draw() {
    drawBg();

    ctx.textAlign = "left";
    ctx.fillStyle = "#e6e9ef";
    ctx.textBaseline = "alphabetic";
    ctx.font = "bold 25px -apple-system, 'Helvetica Neue', sans-serif";
    ctx.fillText("Upcoming Space Launches", 24, 38);
    ctx.strokeStyle = "#7aa2f7";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(24, 46);
    ctx.lineTo(24 + ctx.measureText("Upcoming Space Launches").width, 46);
    ctx.stroke();

    if (loading && launches.length === 0) {
      drawCentered("Loading…");
      return;
    }

    if (launches.length === 0) {
      if (errorMsg) {
        drawCentered(`Space Launch Schedule — ${errorMsg}`);
      } else {
        drawCentered("No upcoming launches");
      }
      return;
    }

    const count = parseInt(cfg.count) || 5;
    const rows = Math.min(launches.length, count);
    const top = 62;
    const rowH = (H - top) / rows;
    const nameSize = rowH >= 110 ? 30 : rowH >= 80 ? 25 : rowH >= 58 ? 20 : 16;
    const subSize  = rowH >= 110 ? 19 : rowH >= 80 ? 16 : 13;
    const cdSize   = rowH >= 110 ? 34 : rowH >= 80 ? 27 : rowH >= 58 ? 21 : 16;
    const accentW = 6;
    const textX = 24 + accentW + 14;
    const cdColW = rowH >= 110 ? 165 : rowH >= 80 ? 132 : 104;
    const cdX = W - 24;
    const textMaxW = cdX - cdColW - textX;

    for (let i = 0; i < rows; i++) {
      const l = launches[i];
      const rowY = top + i * rowH;
      const midY = rowY + rowH / 2;

      if (i > 0) {
        ctx.strokeStyle = "rgba(128,137,166,0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(24, rowY);
        ctx.lineTo(W - 24, rowY);
        ctx.stroke();
      }

      const accent = ACCENTS[i % ACCENTS.length];
      ctx.fillStyle = accent;
      ctx.fillRect(24, rowY + 4, accentW, rowH - 8);

      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#e6e9ef";
      ctx.font = `600 ${nameSize}px -apple-system, 'Helvetica Neue', sans-serif`;
      ctx.fillText("🚀 " + truncate(l.name, textMaxW - (nameSize + 10)), textX, midY - rowH * 0.11);

      ctx.fillStyle = "#aab3d0";
      ctx.font = `${subSize}px -apple-system, 'Helvetica Neue', sans-serif`;
      const sub = [l.provider, l.pad].filter(Boolean).join(" · ");
      ctx.fillText(truncate(sub, textMaxW), textX, midY + rowH * 0.22);

      const remaining = l.netMs - Date.now();
      const cd = formatCountdown(remaining);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = `bold ${cdSize}px -apple-system, 'Helvetica Neue', sans-serif`;
      ctx.fillStyle = countdownColor(remaining);
      ctx.fillText(cd, cdX, midY);
    }

    if (errorMsg) {
      ctx.textAlign = "left";
      ctx.fillStyle = "#8089a6";
      ctx.font = "13px -apple-system, 'Helvetica Neue', sans-serif";
      ctx.fillText(errorMsg, 24, H - 8);
    }
  }

  async function refresh() {
    try {
      const res = await xemd.proxy.fetch(buildUrl());
      if (res.ok) {
        launches = parseLaunches(await res.json());
        errorMsg = null;
      } else {
        errorMsg = "HTTP " + res.status;
      }
    } catch (err) {
      errorMsg = "offline";
    }
    loading = false;
    draw();
  }

  // Draw an initial loading state immediately so the widget is never blank.
  draw();

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    refresh();
  });

  xemd.onRefresh(refresh);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    refresh(); // count changes the query -> refetch
  });

  setInterval(draw, 1000); // live countdown tick, no refetch

  xemd.ready();
</script>
</body>
</html>
