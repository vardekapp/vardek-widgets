<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CISA Known Exploited Vulnerabilities</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  #panel {
    position: relative; width: 100vw; height: 100vh;
    display: flex; flex-direction: column;
    background: radial-gradient(120vw 60vh at 50% 0%, rgba(224,175,104,.05), transparent 60%), #0b0e14;
  }
  .rail { position: absolute; top: 0; bottom: 0; width: 1.4vw; max-width: 34px;
    background: repeating-linear-gradient(180deg, #05070a 0 2px, #0d1119 2px 4px); }
  .rail.l { left: 0; } .rail.r { right: 0; }
  .rail .hole { position: absolute; left: 50%; width: 12px; height: 12px; border-radius: 50%;
    background: #050608; box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.03);
    transform: translateX(-50%); }

  header { margin: 2vh 4.4vw 0; display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px dashed rgba(224,175,104,.35); padding-bottom: 1vh; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }
  header .title { color: #e0af68; font-weight: 600; font-size: clamp(14px, 1.4vw, 22px); letter-spacing: 2px; }
  header .meta { color: #565f89; font-size: clamp(10px, .75vw, 14px); letter-spacing: 1px; }
  header .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #e0af68; margin-right: 8px; box-shadow: 0 0 6px rgba(224,175,104,.8); }

  #tape { margin: 1.4vh 4.4vw; display: flex; flex-direction: column; flex: 1; justify-content: space-between; min-height: 0; }
  .row { display: flex; align-items: center; gap: 1vw; padding: .5vh 0; cursor: pointer; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }
  .row + .row { border-top: 1px dashed rgba(255,255,255,.08); }
  .row:hover .name, .row:focus-visible .name { color: #e0af68; }
  .stamp { flex: 0 0 auto; font-size: clamp(9px, .62vw, 11px); font-weight: 700; letter-spacing: 1.5px; color: #f7768e;
    border: 1.5px solid #f7768e; border-radius: 3px; padding: 1px 6px; transform: rotate(-6deg);
    opacity: .92; text-shadow: 0 0 6px rgba(247,118,142,.5); visibility: hidden; }
  .stamp.on { visibility: visible; }
  .cve { flex: 0 0 11vw; color: #c0caf5; font-weight: 700; font-size: clamp(11px, .82vw, 15px); letter-spacing: .5px; }
  .vendor { flex: 0 0 17vw; color: #8089a6; font-size: clamp(10px, .7vw, 13px); font-family: -apple-system, sans-serif; }
  .vendor b { color: #e6e9ef; font-weight: 600; }
  .name { flex: 1 1 auto; color: #e6e9ef; font-size: clamp(10px, .7vw, 13px); font-family: -apple-system, sans-serif;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .due { flex: 0 0 9vw; text-align: right; font-size: clamp(10px, .7vw, 13px); font-weight: 700; letter-spacing: .5px; }
  .due.overdue { color: #f7768e; } .due.soon { color: #e0af68; } .due.ok { color: #565f89; }

  footer { margin: 0 4.4vw 2vh; display: flex; justify-content: space-between; color: #565f89;
    font-size: clamp(9px, .65vw, 12px); letter-spacing: 1px; border-top: 1px dashed rgba(224,175,104,.25);
    padding-top: 1vh; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; }

  #centered { flex: 1; display: flex; align-items: center; justify-content: center; color: #565f89;
    font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace; font-size: clamp(12px, 1vw, 18px); }
</style>
</head>
<body>
<div id="panel">
  <div class="rail l" id="rl"></div>
  <div class="rail r" id="rr"></div>
  <header>
    <div class="title">⌁ CISA WIRE — KNOWN EXPLOITED VULNERABILITIES</div>
    <div class="meta"><span class="dot"></span><span id="catalogMeta">LOADING…</span></div>
  </header>
  <div id="tape"></div>
  <footer>
    <span id="sortMeta">SORT: DUE DATE ↑</span>
    <span>SOURCE: cisa.gov/kev · TAP A BULLETIN FOR THE NVD RECORD</span>
  </footer>
</div>
<script src="kev.js"></script>
<script type="module">
  import { xemd, escapeHtml } from '/sdk/widget-sdk.js';

  const { parseKev, parseFeedText, daysUntil, statusFor, sortEntries } = globalThis.Kev;
  const FEED_URL = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json";

  const tape = document.getElementById("tape");
  const catalogMeta = document.getElementById("catalogMeta");
  const sortMeta = document.getElementById("sortMeta");

  const defaults = { sort: "dueDate", rowCount: "7", ransomwareOnly: false };
  let cfg = Object.assign({}, defaults);
  let catalog = { entries: [] };
  let errorMsg = null;

  function rowHtml(entry) {
    const days = daysUntil(entry.dueDate, Date.now());
    const status = statusFor(days);
    return `
      <div class="row" data-url="${escapeHtml(entry.nvdUrl)}" tabindex="0" role="link">
        <span class="stamp${entry.ransomware ? " on" : ""}">RUSH</span>
        <span class="cve">${escapeHtml(entry.cveId)}</span>
        <span class="vendor"><b>${escapeHtml(entry.vendor)}</b> · ${escapeHtml(entry.product)}</span>
        <span class="name">${escapeHtml(entry.name)}</span>
        <span class="due ${status.tone}">${escapeHtml(status.label)}</span>
      </div>`;
  }

  function render() {
    if (errorMsg && catalog.entries.length === 0) {
      tape.innerHTML = `<div id="centered">CISA WIRE — ${escapeHtml(errorMsg)}</div>`;
      return;
    }
    if (catalog.entries.length === 0) {
      tape.innerHTML = `<div id="centered">Loading bulletin…</div>`;
      return;
    }
    let entries = sortEntries(catalog.entries, cfg.sort);
    if (cfg.ransomwareOnly) entries = entries.filter(e => e.ransomware);
    entries = entries.slice(0, parseInt(cfg.rowCount, 10) || 7);
    tape.innerHTML = entries.map(rowHtml).join("");
    sortMeta.textContent = "SORT: " + (cfg.sort === "dateAdded" ? "NEWEST ADDED" : "DUE DATE ↑");
  }

  tape.addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (row && row.dataset.url) xemd.openLink(row.dataset.url);
  });
  tape.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const row = e.target.closest(".row");
    if (row && row.dataset.url) { e.preventDefault(); xemd.openLink(row.dataset.url); }
  });

  async function refresh() {
    try {
      const res = await xemd.proxy.fetch(FEED_URL);
      if (res.ok) {
        // The proxy caps responses at 1 MB; the live feed exceeds that, so the
        // body may be truncated mid-object. parseFeedText recovers every
        // complete entry before the cut instead of throwing on invalid JSON.
        catalog = parseKev(parseFeedText(await res.text()));
        errorMsg = null;
        catalogMeta.textContent = `CATALOG ${catalog.catalogVersion} · ${catalog.count} ENTRIES`;
      } else {
        errorMsg = "HTTP " + res.status;
      }
    } catch (err) {
      errorMsg = "offline";
    }
    render();
  }

  for (const id of ["rl", "rr"]) {
    const rail = document.getElementById(id);
    for (let y = 10; y < 710; y += 26) {
      const h = document.createElement("div");
      h.className = "hole"; h.style.top = (y / 720 * 100) + "%";
      rail.appendChild(h);
    }
  }

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    render();
    refresh();
  });

  xemd.onRefresh(refresh);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    refresh();
  });

  xemd.ready();
</script>
</body>
</html>
