<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
  }
  #board { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="board" width="1280" height="720"></canvas>
<script src="launches.js"></script>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");

  let W = canvas.width, H = canvas.height;
  function fit() {
    W = canvas.width = Math.round(window.innerWidth) || 1280;
    H = canvas.height = Math.round(window.innerHeight) || 720;
    draw();
  }
  window.addEventListener("resize", fit);
  const { parseLaunches, formatCountdown } = globalThis.Launches;

  // Cockpit palette (DESIGN.md): one flat accent, no per-row cycling — a color
  // that means nothing (row index) is noise, not information.
  const ROW_ACCENT = "#7aa2f7"; // Panel Indigo
  const SANS = "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif";
  const MONO = "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace";

  const defaults = { count: "5" };
  let cfg = Object.assign({}, defaults);
  let launches = [];
  let errorMsg = null;
  let loading = true;

  function buildUrl() {
    return "https://ll.thespacedevs.com/2.2.0/launch/upcoming/?limit=" + parseInt(cfg.count) + "&mode=list";
  }

  function roundRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function drawBg() {
    ctx.clearRect(0, 0, W, H);

    // Deep spatial radial gradient
    const bgGrad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W / 1.2);
    bgGrad.addColorStop(0, "#0b1329");
    bgGrad.addColorStop(0.6, "#060a17");
    bgGrad.addColorStop(1, "#02040a");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawCentered(text) {
    ctx.font = "600 22px " + SANS;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#8089a6";
    ctx.fillText(text, W / 2, H / 2);
  }

  function truncate(text, maxWidth) {
    if (ctx.measureText(text).width <= maxWidth) return text;
    let lo = 0, hi = text.length;
    while (lo < hi) {
      const mid = (lo + hi + 1) >> 1;
      if (ctx.measureText(text.slice(0, mid) + "…").width <= maxWidth) lo = mid;
      else hi = mid - 1;
    }
    return lo > 0 ? text.slice(0, lo) + "…" : "…";
  }

  // Urgency maps directly onto DESIGN.md's own alert colors — no invented hex.
  function countdownColors(remaining) {
    if (remaining <= 0) return { text: "#30d158", rgb: "48,209,88" };      // OK Green — launched
    const hours = remaining / 3600000;
    if (hours < 1) return { text: "#f7768e", rgb: "247,118,142" };        // Panel Red — imminent
    if (hours < 24) return { text: "#e0af68", rgb: "224,175,104" };       // Panel Amber — soon
    return { text: "#7aa2f7", rgb: "122,162,247" };                       // Panel Indigo — later
  }

  function drawHeader() {
    const padX = 24, padY = 16, headerH = 54;

    // Flat, opaque cockpit panel — no gradient, no shadow.
    ctx.fillStyle = "#161b28";
    roundRect(padX, padY, W - (padX * 2), headerH, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
    ctx.lineWidth = 1;
    roundRect(padX, padY, W - (padX * 2), headerH, 12);
    ctx.stroke();

    // Title
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.font = "800 20px " + SANS;
    ctx.fillStyle = "#e6e9ef";
    ctx.fillText("UPCOMING SPACE LAUNCHES", padX + 20, padY + headerH / 2);

    // Pulse Live Indicator
    const liveX = W - padX - 24;
    const liveY = padY + headerH / 2;
    const t = Date.now() / 1000;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);

    ctx.beginPath();
    ctx.arc(liveX, liveY, 4, 0, 2 * Math.PI);
    ctx.fillStyle = "#30d158";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(liveX, liveY, 4 + pulse * 4, 0, 2 * Math.PI);
    ctx.strokeStyle = "rgba(48, 209, 88, " + (0.6 - pulse * 0.4) + ")";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function draw() {
    drawBg();
    drawHeader();

    if (loading && launches.length === 0) {
      drawCentered("Loading launches…");
      return;
    }

    if (launches.length === 0) {
      if (errorMsg) {
        drawCentered(`Space Launch Schedule — ${errorMsg}`);
      } else {
        drawCentered("No upcoming launches scheduled");
      }
      return;
    }

    const count = parseInt(cfg.count) || 5;
    const rows = Math.min(launches.length, count);
    const top = 82;
    const padX = 24;
    const bottomPad = 20;
    const availableH = H - top - bottomPad;
    const rowGap = Math.min(12, availableH / (rows * 5));
    const rowH = (availableH - (rowGap * (rows - 1))) / rows;

    const nameSize = rowH >= 90 ? 24 : rowH >= 65 ? 20 : rowH >= 45 ? 16 : 14;
    const subSize  = rowH >= 90 ? 16 : 14; // Fourteen-Pixel Floor: never below 14
    const cdSize   = rowH >= 90 ? 22 : rowH >= 65 ? 18 : 14;

    const badgeW = rowH >= 90 ? 190 : rowH >= 65 ? 150 : 120;
    const badgeH = Math.min(42, rowH * 0.65);
    const cardPadX = 20;
    const accentW = 4;

    for (let i = 0; i < rows; i++) {
      const l = launches[i];
      const rowY = top + i * (rowH + rowGap);
      const rowW = W - (padX * 2);
      const midY = rowY + rowH / 2;

      // Flat, opaque cockpit row — no gradient, no shadow.
      ctx.fillStyle = "#161b28";
      roundRect(padX, rowY, rowW, rowH, 12);
      ctx.fill();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.06)";
      ctx.lineWidth = 1;
      roundRect(padX, rowY, rowW, rowH, 12);
      ctx.stroke();

      // Left accent ribbon — one flat cockpit color, not a per-row cycle
      // that means nothing (row index carries no information).
      ctx.fillStyle = ROW_ACCENT;
      roundRect(padX + 2, rowY + (rowH - (rowH * 0.6)) / 2, accentW, rowH * 0.6, 2);
      ctx.fill();

      // Text positions
      const textX = padX + accentW + cardPadX;
      const cdBadgeX = padX + rowW - cardPadX - badgeW;
      const textMaxW = cdBadgeX - textX - 16;

      // Rocket Title
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#e6e9ef";
      ctx.font = `700 ${nameSize}px ${SANS}`;

      const titleY = subSize > 0 ? midY - (rowH * 0.12) : midY;
      ctx.fillText("🚀 " + truncate(l.name, textMaxW - 30), textX, titleY);

      // Subtitle (Provider / Pad)
      if (rowH >= 45) {
        ctx.fillStyle = "#8089a6";
        ctx.font = `500 ${subSize}px ${SANS}`;
        const sub = [l.provider, l.pad].filter(Boolean).join("  ·  ");
        ctx.fillText(truncate(sub, textMaxW), textX, midY + (rowH * 0.18));
      }

      // Countdown Badge Box — flat, opaque.
      const remaining = l.netMs - Date.now();
      const cd = formatCountdown(remaining);
      const cdTheme = countdownColors(remaining);
      const badgeY = midY - badgeH / 2;

      ctx.fillStyle = "#0b0e14";
      roundRect(cdBadgeX, badgeY, badgeW, badgeH, badgeH / 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(" + cdTheme.rgb + ", 0.4)";
      ctx.lineWidth = 1;
      roundRect(cdBadgeX, badgeY, badgeW, badgeH, badgeH / 2);
      ctx.stroke();

      // Countdown text — the Mono Numerals Rule: it ticks every second, so it's SF Mono.
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `600 ${cdSize}px ${MONO}`;
      ctx.fillStyle = cdTheme.text;
      ctx.fillText(cd, cdBadgeX + badgeW / 2, midY);
    }

    if (errorMsg) {
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#f7768e";
      ctx.font = "500 14px " + SANS;
      ctx.fillText(errorMsg, padX, H - 8);
    }
  }

  async function refresh() {
    try {
      const res = await xemd.proxy.fetch(buildUrl());
      if (res.ok) {
        launches = parseLaunches(await res.json());
        errorMsg = null;
      } else {
        errorMsg = "HTTP " + res.status;
      }
    } catch (err) {
      errorMsg = "offline";
    }
    loading = false;
    draw();
  }

  fit();

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    refresh();
  });

  xemd.onRefresh(refresh);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    refresh();
  });

  setInterval(draw, 1000);

  xemd.ready();
</script>
</body>
</html>
