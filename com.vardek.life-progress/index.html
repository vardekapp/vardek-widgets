<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #map { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="map" width="2560" height="720"></canvas>
<script src="progress.js"></script>
<script>
  const W = 2560, H = 720;
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");

  const defaults = {
    birthDate: "1990-01-01",
    lifeExpectancy: 80,
    showLife: true,
    showYear: true,
    showMonth: true,
    showWeek: true,
    showDay: true
  };
  let cfg = defaults;

  function roundRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  // Cockpit palette (DESIGN.md): Panel Indigo is the primary accent, Panel
  // Violet the secondary; Life alone escalates to Amber/Red as it nears its
  // threshold — the one bar where that's a genuine warning, not decoration.
  const PANEL_INDIGO = "#7aa2f7";
  const PANEL_VIOLET = "#bb9af7";
  const PANEL_AMBER = "#e0af68";
  const PANEL_RED = "#f7768e";
  const accentFor = (bar) => {
    if (bar.key === "life") {
      if (bar.fraction >= 0.9) return PANEL_RED;
      if (bar.fraction >= 0.75) return PANEL_AMBER;
      return PANEL_INDIGO;
    }
    return bar.key === "year" || bar.key === "month" ? PANEL_INDIGO : PANEL_VIOLET;
  };

  const SANS = "-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif";
  const MONO = "ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace";

  function drawEmptyState() {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "600 14px " + SANS;
    ctx.fillStyle = "#565f89";
    ctx.fillText("NO BARS ENABLED — TURN ONE ON IN ADMIN", W / 2, H / 2);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    const bars = globalThis.Progress.progressData(Date.now(), cfg);
    const n = bars.length;
    if (n === 0) { drawEmptyState(); return; }

    const outerPadX = 40;
    const outerPadY = 24;
    const availableH = H - (outerPadY * 2);
    const gap = Math.min(16, availableH / (n * 4));
    const cardH = (availableH - (gap * (n - 1))) / n;

    const labelW = 240;
    const rightW = 320;
    const cardPadX = 36;
    const trackH = Math.min(32, cardH * 0.38);

    bars.forEach((bar, i) => {
      const cardY = outerPadY + i * (cardH + gap);
      const cardX = outerPadX;
      const cardW = W - (outerPadX * 2);
      const cy = cardY + cardH / 2;
      const accent = accentFor(bar);

      // Card: flat, opaque cockpit cell — no gradient, no shadow.
      ctx.fillStyle = "#11151f";
      roundRect(cardX, cardY, cardW, cardH, 16);
      ctx.fill();
      ctx.strokeStyle = "#1c2233";
      ctx.lineWidth = 1;
      roundRect(cardX, cardY, cardW, cardH, 16);
      ctx.stroke();

      // Label — Panel Title voice (sans, 700, 1.6rem step), tinted by accent.
      const labelX = cardX + cardPadX;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.font = "700 25.6px " + SANS;
      ctx.fillStyle = accent;
      ctx.fillText(bar.label.toUpperCase(), labelX, cy);

      // Track configuration
      const trackX = labelX + labelW;
      const trackW = cardW - (cardPadX * 2) - labelW - rightW;
      const trackY = cy - trackH / 2;

      // Track inset — flat, opaque.
      ctx.fillStyle = "#080a10";
      roundRect(trackX, trackY, trackW, trackH, trackH / 2);
      ctx.fill();

      // Filled progress — flat accent fill, no gradient, no glow.
      const fillW = Math.max(trackH, trackW * bar.fraction);
      if (bar.fraction > 0) {
        ctx.fillStyle = accent;
        roundRect(trackX, trackY, fillW, trackH, trackH / 2);
        ctx.fill();
      }

      // Percentage — the Mono Numerals Rule: every live-updating value is SF Mono.
      const rightX = cardX + cardW - cardPadX;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.font = "600 41.6px " + MONO;
      ctx.fillStyle = "#e6e9ef";
      ctx.fillText((bar.fraction * 100).toFixed(1) + "%", rightX, cy - 12);

      // Sub-detail text
      ctx.font = "500 16px " + SANS;
      ctx.fillStyle = "#8089a6";
      ctx.fillText(bar.detail, rightX, cy + 18);
    });
  }

  document.addEventListener("vardek:ready", () => {
    cfg = Object.assign({}, defaults, window.Vardek ? Vardek.settings : {});
    draw();
  });
  draw();
  setInterval(draw, 200);
</script>
</body>
</html>
