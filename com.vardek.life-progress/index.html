<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #map { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="map" width="2560" height="720"></canvas>
<script src="progress.js"></script>
<script>
  const W = 2560, H = 720;
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");

  const defaults = {
    birthDate: "1990-01-01",
    lifeExpectancy: 80,
    showLife: true,
    showYear: true,
    showMonth: true,
    showWeek: true,
    showDay: true
  };
  let cfg = defaults;

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    const bars = globalThis.Progress.progressData(Date.now(), cfg);
    const n = bars.length;
    if (n === 0) return;

    // Per-bar colors: key → {main, dark}
    const colorMap = {
      life:  { main: "#ffcc66", dark: "#d4a444" },
      year:  { main: "#7aa2f7", dark: "#5a7cc7" },
      month: { main: "#3ad16b", dark: "#2a9a4b" },
      week:  { main: "#bf5af2", dark: "#8f3ac2" },
      day:   { main: "#5ac8fa", dark: "#3a98ca" }
    };

    const rowH = H / n;
    const padX = 48;
    const labelW = 220;
    const detailW = 260;
    const trackH = Math.min(28, rowH * 0.32);
    const trackX = padX + labelW;
    const trackW = W - padX * 2 - labelW - detailW;

    bars.forEach((bar, i) => {
      const cy = rowH * i + rowH / 2;
      const colors = colorMap[bar.key] || { main: "#7aa2f7", dark: "#5a7cc7" };

      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.font = "48px -apple-system, 'Helvetica Neue', sans-serif";
      ctx.fillStyle = "#e6e9ef";
      ctx.fillText(bar.label, padX, cy);

      const trackY = cy - trackH / 2;
      ctx.fillStyle = "#1a1f30";
      roundRect(trackX, trackY, trackW, trackH, trackH / 2);
      ctx.fill();

      // Track top highlight
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(trackX + trackH / 2, trackY + 1);
      ctx.lineTo(trackX + trackW - trackH / 2, trackY + 1);
      ctx.stroke();

      const fillW = Math.max(trackH, trackW * bar.fraction);
      if (bar.fraction > 0) {
        // Gradient from dark to main color (horizontal)
        const gradient = ctx.createLinearGradient(trackX, 0, trackX + fillW, 0);
        gradient.addColorStop(0, colors.dark);
        gradient.addColorStop(1, colors.main);

        // Soft glow
        ctx.shadowColor = colors.main;
        ctx.shadowBlur = 5;

        ctx.fillStyle = gradient;
        roundRect(trackX, trackY, fillW, trackH, trackH / 2);
        ctx.fill();

        // Reset shadow
        ctx.shadowColor = "transparent";
        ctx.shadowBlur = 0;
      }

      ctx.textAlign = "right";
      ctx.font = "32px -apple-system, 'Helvetica Neue', sans-serif";
      ctx.fillStyle = "#e6e9ef";
      ctx.fillText(`${Math.round(bar.fraction * 100)}%`, W - padX, cy - 14);
      ctx.font = "22px -apple-system, 'Helvetica Neue', sans-serif";
      ctx.fillStyle = "#8089a6";
      ctx.fillText(bar.detail, W - padX, cy + 16);
    });
  }

  document.addEventListener("vardek:ready", () => {
    cfg = Object.assign({}, defaults, window.Vardek ? Vardek.settings : {});
    draw();
  });
  draw();
  setInterval(draw, 1000);
</script>
</body>
</html>
