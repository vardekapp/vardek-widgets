<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nixie Clock</title>
<style>
  :root {
    --glow-rgb: 255, 149, 0; /* JS overwrites from settings.glowColor */
    --glass-top: #1c1c1e;    /* neutral — real nixie glass is clear, color comes from the light */
    --glass-bot: #0a0a0b;
    --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    height: 100vh; width: 100vw; overflow: hidden;
    background: #050506;
    display: flex; align-items: center; justify-content: center;
  }
  #root {
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(6px, 1.25vw, 28px);
    padding: clamp(8px, 1.6vw, 42px);
  }

  .bank {
    display: inline-flex; gap: 4px;
    padding: 10px 12px; border-radius: 5px;
    background: radial-gradient(120% 160% at 50% 0%, #171a1e 0%, #0d0f11 70%);
    border: 1px solid rgba(255,255,255,.09);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.03), 0 0 26px rgba(var(--glow-rgb), .35);
  }
  #time-bank { font-size: clamp(22px, 5.6vw, 160px); }
  #date-bank { font-size: clamp(11px, 2.1vw, 60px); }

  .tube {
    position: relative;
    display: flex; align-items: flex-end; justify-content: center;
    width: .92em; height: 1.5em;
    border-radius: 6px 6px 3px 3px;
    background: linear-gradient(180deg, var(--glass-top) 0%, var(--glass-bot) 100%);
    border: 1px solid rgba(var(--glow-rgb), .18);
    overflow: hidden;
  }
  .tube::before {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(0deg, transparent 0 3px, rgba(255,255,255,.025) 3px 4px);
    pointer-events: none;
  }
  .tube.punc { background: transparent; border: none; width: .4em; }

  .ghost-stack { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; z-index: 1; pointer-events: none; }
  .ghost-stack span {
    position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center;
    font-family: var(--font-mono); font-weight: 200; font-size: 1em; line-height: 1.35;
    color: rgba(var(--glow-rgb), .08);
  }

  .tube .digit {
    position: relative; z-index: 2;
    font-family: var(--font-mono); font-weight: 200; color: rgb(var(--glow-rgb));
    text-shadow: 0 0 8px rgba(var(--glow-rgb), .9), 0 0 20px rgba(var(--glow-rgb), .45);
    font-size: 1em; line-height: 1.35;
    animation: tube-flicker 6s ease-in-out infinite;
    animation-delay: calc(var(--tube-index, 0) * -0.37s);
  }
  .tube.punc .digit { text-shadow: 0 0 6px rgba(var(--glow-rgb), .6); opacity: .8; }

  .tube-in { animation: tube-rise .55s cubic-bezier(0,0,.2,1); }
  @keyframes tube-rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  @keyframes tube-flicker {
    0%, 100% { opacity: 1; filter: brightness(1); }
    92%      { opacity: 1; filter: brightness(1); }
    93%      { opacity: .85; filter: brightness(.9); }
    94%      { opacity: 1; filter: brightness(1.05); }
    97%      { opacity: .95; filter: brightness(.97); }
    98%      { opacity: 1; filter: brightness(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .tube-in, .tube .digit { animation: none; }
  }
</style>
</head>
<body>
<div id="root">
  <span id="time-bank"></span>
  <span id="date-bank"></span>
</div>
<script>
  var defaults = { use24Hour: true, showSeconds: true, showDate: true, glowColor: "#ff9500" };
  var cfg = defaults;

  function applyGlow(hex) {
    var valid = typeof hex === "string" && /^#[0-9a-f]{6}$/i.test(hex);
    var n = parseInt((valid ? hex : defaults.glowColor).slice(1), 16);
    document.documentElement.style.setProperty(
      "--glow-rgb", ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255)
    );
  }

  // Builds a .bank of .tube spans from a digit/punctuation string ("14:07:52",
  // "09.08.26"). Adapted from concept-nixie's bank() helper, extended with the
  // ghost-digit stack and a --tube-index property for flicker desync.
  function bank(str) {
    var el = document.createElement("span");
    el.className = "bank";
    str.split("").forEach(function (ch, i) {
      var isDigit = /[0-9]/.test(ch);
      var t = document.createElement("span");
      t.className = "tube tube-in" + (isDigit ? "" : " punc");
      t.style.setProperty("--tube-index", i);
      if (isDigit) {
        var ghosts = document.createElement("span");
        ghosts.className = "ghost-stack";
        ghosts.setAttribute("aria-hidden", "true");
        for (var g = 0; g <= 9; g++) {
          var s = document.createElement("span");
          s.textContent = String(g);
          ghosts.appendChild(s);
        }
        t.appendChild(ghosts);
      }
      var d = document.createElement("span");
      d.className = "digit";
      d.textContent = ch;
      t.appendChild(d);
      el.appendChild(t);
    });
    return el;
  }

  function tick() {
    var now = new Date();
    var h = now.getHours();
    if (!cfg.use24Hour) { h = h % 12; if (h === 0) h = 12; }
    var hh = String(h).padStart(2, "0");
    var mm = String(now.getMinutes()).padStart(2, "0");
    var ss = String(now.getSeconds()).padStart(2, "0");
    var timeStr = cfg.showSeconds ? (hh + ":" + mm + ":" + ss) : (hh + ":" + mm);
    document.getElementById("time-bank").replaceChildren(bank(timeStr));

    var dateEl = document.getElementById("date-bank");
    if (cfg.showDate) {
      var dd = String(now.getDate()).padStart(2, "0");
      var MM = String(now.getMonth() + 1).padStart(2, "0");
      var yy = String(now.getFullYear() % 100).padStart(2, "0");
      dateEl.replaceChildren(bank(dd + "." + MM + "." + yy));
      dateEl.style.display = "";
    } else {
      dateEl.style.display = "none";
    }
  }

  document.addEventListener("vardek:ready", function () {
    cfg = Object.assign({}, defaults, Vardek.settings);
    applyGlow(cfg.glowColor);
    tick();
  });
  applyGlow(defaults.glowColor);
  tick();
  // 1 s is enough for a seconds display; 250 ms was 3 wasted wakeups/s on an always-on panel.
  setInterval(tick, 1000);
</script>
</body>
</html>
