<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #map { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="map" width="2560" height="720"></canvas>
<script src="land.js"></script>
<script src="quakes.js"></script>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';

  const W = 2560, H = 720;
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const { parseQuakes, magRadius, project, magColor } = globalThis.Quakes;

  const defaults = { minMagnitude: "2.5", window: "24h", showLand: true };
  let cfg = defaults;
  let quakes = [];
  let errorMsg = null;
  let selected = null;

  const LEGEND_BANDS = [
    { label: "< M3", color: "#3ad16b" },
    { label: "M3–4", color: "#ffd60a" },
    { label: "M4–5", color: "#ff9f0a" },
    { label: "M5–6", color: "#ff453a" },
    { label: "M6+",  color: "#ff2d95" },
  ];

  function drawOcean() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#070a14");
    grad.addColorStop(0.5, "#0d1220");
    grad.addColorStop(1, "#070a14");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawLand() {
    if (!cfg.showLand || !Array.isArray(globalThis.LAND)) return;
    ctx.fillStyle = "#243049";
    ctx.strokeStyle = "#3a4a6b";
    ctx.lineWidth = 1;
    for (const ring of globalThis.LAND) {
      ctx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const p = project(lon, lat, W, H);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return (n >> 16) + "," + ((n >> 8) & 255) + "," + (n & 255);
  }

  function drawGraticule() {
    ctx.strokeStyle = "rgba(122,162,247,0.07)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 8]);
    for (let lat = -60; lat <= 60; lat += 30) {
      if (lat === 0) continue;
      const y = (90 - lat) / 180 * H;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let lon = -150; lon <= 150; lon += 30) {
      const x = (lon + 180) / 360 * W;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.strokeStyle = "rgba(122,162,247,0.12)";
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
  }

  function drawQuakes() {
    const ordered = quakes.slice().sort((a, b) => a.mag - b.mag);
    const t = Date.now() / 1000;
    const now = Date.now();

    for (const q of ordered) {
      const p = project(q.lon, q.lat, W, H);
      const r = magRadius(q.mag);
      const color = magColor(q.mag);

      if (q.mag >= 4) {
        ctx.shadowColor = color;
        ctx.shadowBlur = Math.min(22, q.mag * 3);
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowColor = "transparent";

      ctx.strokeStyle = "rgba(0,0,0,0.4)";
      ctx.lineWidth = 1;
      ctx.stroke();

      if (q.timeMs && (now - q.timeMs) < 3600000) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 3 + q.timeMs * 0.001);
        const rgb = hexToRgb(color);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 3 + pulse * 4, 0, 2 * Math.PI);
        ctx.strokeStyle = "rgba(" + rgb + "," + (0.15 + 0.35 * pulse) + ")";
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    if (selected) {
      const p = project(selected.lon, selected.lat, W, H);
      const r = magRadius(selected.mag);
      for (let ring = 0; ring < 3; ring++) {
        const phase = ((t * 0.7 + ring * 0.33) % 1);
        const ringR = r + 4 + phase * 30;
        const alpha = (1 - phase) * 0.45;
        ctx.beginPath();
        ctx.arc(p.x, p.y, ringR, 0, 2 * Math.PI);
        ctx.strokeStyle = "rgba(255,255,255," + alpha + ")";
        ctx.lineWidth = Math.max(0.5, 2 - phase * 1.5);
        ctx.stroke();
      }
    }
  }

  function drawTitle() {
    ctx.font = "bold 25px -apple-system, 'Helvetica Neue', sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    if (errorMsg && quakes.length === 0) {
      ctx.fillStyle = "#8089a6";
      ctx.fillText("Earthquake Monitor — " + errorMsg, 24, 38);
      return;
    }
    ctx.fillStyle = "#e6e9ef";
    ctx.fillText("Earthquake Monitor", 24, 38);
    ctx.strokeStyle = "#7aa2f7";
    ctx.lineWidth = 2;
    const tw = ctx.measureText("Earthquake Monitor").width;
    ctx.beginPath(); ctx.moveTo(24, 46); ctx.lineTo(24 + tw, 46); ctx.stroke();

    ctx.font = "16px -apple-system, 'Helvetica Neue', sans-serif";
    ctx.fillStyle = "#5a6888";
    const sub = quakes.length + " quakes · M" + cfg.minMagnitude + "+ · last " + cfg.window;
    ctx.fillText(sub, 24, 66);
    if (errorMsg) {
      ctx.fillStyle = "#ff453a";
      ctx.fillText(errorMsg, 24 + ctx.measureText(sub).width + 16, 66);
    }
  }

  function drawMagLegend() {
    const pad = 14, rowH = 22;
    const boxW = 120, boxH = pad * 2 + LEGEND_BANDS.length * rowH - (rowH - 14);
    const x0 = W - boxW - 24, y0 = H - boxH - 24;

    ctx.fillStyle = "rgba(8,12,20,0.85)";
    roundRect(x0, y0, boxW, boxH, 10);
    ctx.fill();
    ctx.strokeStyle = "rgba(122,162,247,0.20)";
    ctx.lineWidth = 1;
    roundRect(x0, y0, boxW, boxH, 10);
    ctx.stroke();

    ctx.font = "14px -apple-system, 'Helvetica Neue', sans-serif";
    LEGEND_BANDS.forEach((b, i) => {
      const y = y0 + pad + i * rowH;
      ctx.beginPath();
      ctx.arc(x0 + pad + 7, y + 7, 6, 0, 2 * Math.PI);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.fillStyle = "#8089a6";
      ctx.textAlign = "left";
      ctx.fillText(b.label, x0 + pad + 20, y + 12);
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function relativeTime(timeMs) {
    if (typeof timeMs !== "number") return "unknown time";
    const diffMin = Math.max(0, Math.round((Date.now() - timeMs) / 60000));
    if (diffMin < 60) return `${diffMin} min ago`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `${diffH} h ago`;
    return `${Math.round(diffH / 24)} d ago`;
  }

  function drawInfoPanel() {
    if (!selected) return;
    const q = selected;
    const p = project(q.lon, q.lat, W, H);
    const bandColor = magColor(q.mag);
    const latDir = q.lat >= 0 ? "N" : "S";
    const lonDir = q.lon >= 0 ? "E" : "W";

    const lines = [
      { text: q.place || "Unknown location", font: "600 16px", color: "#e6e9ef" },
      { text: "M" + q.mag.toFixed(1) + (typeof q.depth === "number" ? " · depth " + q.depth.toFixed(1) + " km" : ""), font: "14px", color: bandColor },
      { text: relativeTime(q.timeMs) + " · " + Math.abs(q.lat).toFixed(2) + "° " + latDir + ", " + Math.abs(q.lon).toFixed(2) + "° " + lonDir, font: "14px", color: "#5a6888" },
    ];

    ctx.font = "600 16px -apple-system, 'Helvetica Neue', sans-serif";
    let maxW = 0;
    for (const l of lines) {
      ctx.font = l.font + " -apple-system, 'Helvetica Neue', sans-serif";
      maxW = Math.max(maxW, ctx.measureText(l.text).width);
    }

    const pw = maxW + 32, ph = lines.length * 24 + 20;
    let x = p.x + 20, y = p.y - ph - 20;
    x = Math.max(8, Math.min(W - pw - 8, x));
    y = Math.max(8, Math.min(H - ph - 8, y));

    ctx.fillStyle = "rgba(8,12,20,0.92)";
    roundRect(x, y, pw, ph, 10);
    ctx.fill();
    const rgb = hexToRgb(bandColor);
    ctx.strokeStyle = "rgba(" + rgb + ",0.35)";
    ctx.lineWidth = 1;
    roundRect(x, y, pw, ph, 10);
    ctx.stroke();

    ctx.textAlign = "left";
    lines.forEach((l, i) => {
      ctx.font = l.font + " -apple-system, 'Helvetica Neue', sans-serif";
      ctx.fillStyle = l.color;
      ctx.fillText(l.text, x + 16, y + 24 + i * 24);
    });
  }

  function draw() {
    drawOcean();
    drawLand();
    drawGraticule();
    drawQuakes();
    drawTitle();
    drawMagLegend();
    drawInfoPanel();
  }

  function onTap(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) / r.width * W;
    const cy = (e.clientY - r.top) / r.height * H;
    let best = null, bestDist = Infinity;
    for (const q of quakes) {
      const p = project(q.lon, q.lat, W, H);
      const dist = Math.hypot(p.x - cx, p.y - cy);
      const hit = magRadius(q.mag) + 8;
      if (dist <= hit && dist < bestDist) {
        best = q;
        bestDist = dist;
      }
    }
    selected = best;
    draw();
  }
  canvas.addEventListener("pointerdown", onTap);

  function buildUrl() {
    const winMs = cfg.window === "7d" ? 7 * 864e5 : 864e5;
    const start = new Date(Date.now() - winMs).toISOString();
    return "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=" +
      start + "&minmagnitude=" + parseFloat(cfg.minMagnitude) + "&limit=500&orderby=time";
  }

  async function refresh() {
    try {
      const res = await xemd.proxy.fetch(buildUrl());
      if (res.ok) {
        quakes = parseQuakes(await res.json());
        errorMsg = null;
      } else {
        errorMsg = `HTTP ${res.status}`;
      }
    } catch (err) {
      errorMsg = err && err.message ? err.message : "fetch failed";
    }
    draw();
  }

  draw();
  setInterval(draw, 200);

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    refresh();
  });

  xemd.onRefresh(refresh);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    refresh();
  });

  xemd.ready();
</script>
</body>
</html>
