<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #030712;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }
  #map { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="map" width="2560" height="720"></canvas>
<script src="land.js"></script>
<script src="quakes.js"></script>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';

  const W = 2560, H = 720;
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const { parseQuakes, magRadius, project, magColor } = globalThis.Quakes;

  const defaults = { minMagnitude: "2.5", window: "24h", showLand: true };
  let cfg = defaults;
  let quakes = [];
  let errorMsg = null;
  let selected = null;

  const LEGEND_BANDS = [
    { label: "< M3", color: "#30d158" },
    { label: "M3–4", color: "#ffd60a" },
    { label: "M4–5", color: "#ff9f0a" },
    { label: "M5–6", color: "#ff453a" },
    { label: "M6+",  color: "#ff375f" },
  ];

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
  }

  function roundRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function drawOcean() {
    const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W / 1.2);
    grad.addColorStop(0, "#0b1329");
    grad.addColorStop(0.6, "#060a17");
    grad.addColorStop(1, "#02040a");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawLand() {
    if (!cfg.showLand || !Array.isArray(globalThis.LAND)) return;

    ctx.fillStyle = "rgba(22, 33, 62, 0.55)";
    ctx.strokeStyle = "rgba(56, 189, 248, 0.25)";
    ctx.lineWidth = 1;

    for (const ring of globalThis.LAND) {
      ctx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const p = project(lon, lat, W, H);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawGraticule() {
    ctx.strokeStyle = "rgba(56, 189, 248, 0.05)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 12]);

    for (let lat = -60; lat <= 60; lat += 30) {
      const y = (90 - lat) / 180 * H;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let lon = -150; lon <= 150; lon += 30) {
      const x = (lon + 180) / 360 * W;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    ctx.setLineDash([]);

    // Prime meridian & Equator subtle highlight
    ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  }

  function drawQuakes() {
    const ordered = quakes.slice().sort((a, b) => a.mag - b.mag);
    const t = Date.now() / 1000;
    const now = Date.now();

    for (const q of ordered) {
      const p = project(q.lon, q.lat, W, H);
      const r = magRadius(q.mag);
      const color = magColor(q.mag);

      // Glowing aura for higher magnitude quakes
      if (q.mag >= 3.5) {
        ctx.shadowColor = color;
        ctx.shadowBlur = Math.min(28, q.mag * 4.5);
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, 2 * Math.PI);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.shadowColor = "transparent";

      ctx.strokeStyle = "rgba(0,0,0,0.6)";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Pulsing pulse animation for recent quakes (< 1h)
      if (q.timeMs && (now - q.timeMs) < 3600000) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 4 + q.timeMs * 0.001);
        const rgb = hexToRgb(color);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r + 4 + pulse * 6, 0, 2 * Math.PI);
        ctx.strokeStyle = "rgba(" + rgb + "," + (0.2 + 0.4 * pulse) + ")";
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
    }

    // Selected Quake Radar Target Overlay
    if (selected) {
      const p = project(selected.lon, selected.lat, W, H);
      const r = magRadius(selected.mag);

      for (let ring = 0; ring < 3; ring++) {
        const phase = ((t * 0.8 + ring * 0.33) % 1);
        const ringR = r + 6 + phase * 36;
        const alpha = (1 - phase) * 0.6;
        ctx.beginPath();
        ctx.arc(p.x, p.y, ringR, 0, 2 * Math.PI);
        ctx.strokeStyle = "rgba(56, 189, 248, " + alpha + ")";
        ctx.lineWidth = Math.max(0.8, 2.5 - phase * 2);
        ctx.stroke();
      }

      // Crosshair lines on selected quake
      ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 1;
      const len = r + 12;
      ctx.beginPath(); ctx.moveTo(p.x - len, p.y); ctx.lineTo(p.x + len, p.y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p.x, p.y - len); ctx.lineTo(p.x, p.y + len); ctx.stroke();
    }
  }

  function drawTitle() {
    const boxX = 24, boxY = 24, boxW = 420, boxH = 76;

    // Glass panel container
    const grad = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
    grad.addColorStop(0, "rgba(15, 23, 42, 0.85)");
    grad.addColorStop(1, "rgba(3, 7, 18, 0.90)");

    ctx.fillStyle = grad;
    roundRect(boxX, boxY, boxW, boxH, 14);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.1)";
    ctx.lineWidth = 1.5;
    roundRect(boxX, boxY, boxW, boxH, 14);
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    if (errorMsg && quakes.length === 0) {
      ctx.font = "700 20px -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = "#94a3b8";
      ctx.fillText("SEISMIC MONITOR — " + errorMsg, boxX + 18, boxY + 26);
      return;
    }

    // Title Header
    ctx.font = "800 22px -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif";
    ctx.fillStyle = "#f8fafc";
    ctx.fillText("EARTHQUAKE MONITOR", boxX + 18, boxY + 16);

    // Live Indicator Dot
    ctx.beginPath();
    ctx.arc(boxX + boxW - 24, boxY + 26, 5, 0, 2 * Math.PI);
    ctx.fillStyle = "#30d158";
    ctx.fill();

    // Subtitle Stats
    ctx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillStyle = "#94a3b8";
    const sub = `${quakes.length} EVENTS  ·  MIN M${cfg.minMagnitude}  ·  LAST ${cfg.window.toUpperCase()}`;
    ctx.fillText(sub, boxX + 18, boxY + 46);

    if (errorMsg) {
      ctx.fillStyle = "#ff453a";
      ctx.fillText(" • " + errorMsg, boxX + 18 + ctx.measureText(sub).width, boxY + 46);
    }
  }

  function drawMagLegend() {
    const pad = 14, rowH = 22;
    const boxW = 126, boxH = pad * 2 + LEGEND_BANDS.length * rowH - 6;
    const x0 = W - boxW - 24, y0 = H - boxH - 24;

    const grad = ctx.createLinearGradient(x0, y0, x0, y0 + boxH);
    grad.addColorStop(0, "rgba(15, 23, 42, 0.85)");
    grad.addColorStop(1, "rgba(3, 7, 18, 0.90)");

    ctx.fillStyle = grad;
    roundRect(x0, y0, boxW, boxH, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
    ctx.lineWidth = 1.5;
    roundRect(x0, y0, boxW, boxH, 12);
    ctx.stroke();

    ctx.font = "600 13px -apple-system, BlinkMacSystemFont, sans-serif";
    LEGEND_BANDS.forEach((b, i) => {
      const y = y0 + pad + i * rowH;
      ctx.beginPath();
      ctx.arc(x0 + pad + 6, y + 6, 5, 0, 2 * Math.PI);
      ctx.fillStyle = b.color;
      ctx.fill();

      ctx.fillStyle = "#cbd5e1";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(b.label, x0 + pad + 20, y + 6);
    });
  }

  function relativeTime(timeMs) {
    if (typeof timeMs !== "number") return "unknown time";
    const diffMin = Math.max(0, Math.round((Date.now() - timeMs) / 60000));
    if (diffMin < 60) return `${diffMin} min ago`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `${diffH} h ago`;
    return `${Math.round(diffH / 24)} d ago`;
  }

  function drawInfoPanel() {
    if (!selected) return;
    const q = selected;
    const p = project(q.lon, q.lat, W, H);
    const bandColor = magColor(q.mag);
    const latDir = q.lat >= 0 ? "N" : "S";
    const lonDir = q.lon >= 0 ? "E" : "W";

    const lines = [
      { text: q.place || "Unknown Location", font: "700 16px", color: "#f8fafc" },
      { text: "M" + q.mag.toFixed(1) + (typeof q.depth === "number" ? "  ·  Depth " + q.depth.toFixed(1) + " km" : ""), font: "600 14px", color: bandColor },
      { text: relativeTime(q.timeMs) + "  ·  " + Math.abs(q.lat).toFixed(2) + "°" + latDir + ", " + Math.abs(q.lon).toFixed(2) + "°" + lonDir, font: "500 13px", color: "#94a3b8" },
    ];

    ctx.font = "700 16px -apple-system, BlinkMacSystemFont, sans-serif";
    let maxW = 0;
    for (const l of lines) {
      ctx.font = l.font + " -apple-system, BlinkMacSystemFont, sans-serif";
      maxW = Math.max(maxW, ctx.measureText(l.text).width);
    }

    const pw = maxW + 36, ph = lines.length * 24 + 18;
    let x = p.x + 24, y = p.y - ph - 20;
    x = Math.max(12, Math.min(W - pw - 12, x));
    y = Math.max(12, Math.min(H - ph - 12, y));

    ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
    ctx.shadowColor = "rgba(0, 0, 0, 0.5)";
    ctx.shadowBlur = 18;
    roundRect(x, y, pw, ph, 12);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.shadowColor = "transparent";

    const rgb = hexToRgb(bandColor);
    ctx.strokeStyle = "rgba(" + rgb + ",0.5)";
    ctx.lineWidth = 1.5;
    roundRect(x, y, pw, ph, 12);
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    lines.forEach((l, i) => {
      ctx.font = l.font + " -apple-system, BlinkMacSystemFont, sans-serif";
      ctx.fillStyle = l.color;
      ctx.fillText(l.text, x + 18, y + 14 + i * 24);
    });
  }

  function draw() {
    drawOcean();
    drawLand();
    drawGraticule();
    drawQuakes();
    drawTitle();
    drawMagLegend();
    drawInfoPanel();
  }

  function onTap(e) {
    const r = canvas.getBoundingClientRect();
    const cx = (e.clientX - r.left) / r.width * W;
    const cy = (e.clientY - r.top) / r.height * H;
    let best = null, bestDist = Infinity;
    for (const q of quakes) {
      const p = project(q.lon, q.lat, W, H);
      const dist = Math.hypot(p.x - cx, p.y - cy);
      const hit = magRadius(q.mag) + 10;
      if (dist <= hit && dist < bestDist) {
        best = q;
        bestDist = dist;
      }
    }
    selected = best;
    draw();
  }
  canvas.addEventListener("pointerdown", onTap);

  function buildUrl() {
    const winMs = cfg.window === "7d" ? 7 * 864e5 : 864e5;
    const start = new Date(Date.now() - winMs).toISOString();
    return "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=" +
      start + "&minmagnitude=" + parseFloat(cfg.minMagnitude) + "&limit=500&orderby=time";
  }

  async function refresh() {
    try {
      const res = await xemd.proxy.fetch(buildUrl());
      if (res.ok) {
        quakes = parseQuakes(await res.json());
        errorMsg = null;
      } else {
        errorMsg = `HTTP ${res.status}`;
      }
    } catch (err) {
      errorMsg = err && err.message ? err.message : "fetch failed";
    }
    draw();
  }

  draw();
  setInterval(draw, 200);

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    refresh();
  });

  xemd.onRefresh(refresh);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    refresh();
  });

  xemd.ready();
</script>
</body>
</html>
