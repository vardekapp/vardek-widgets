<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #090d16;
    color: #e6e9ef;
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    height: 100vh;
    overflow: hidden;
    --accent: #7aa2f7; /* Panel Indigo default — still user-overridable via Admin */
    --mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
  }

  #cards {
    display: grid;
    height: 100vh;
    width: 100vw;
    gap: 12px;
    padding: 12px;
    background: #090d16;
  }

  /* Dynamic Layout Templates */
  #cards.layout-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; --scale: 1; }
  #cards.layout-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; --scale: 0.75; }
  #cards.layout-3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; --scale: 0.62; }
  #cards.layout-3 .card:nth-child(3) { grid-column: 1 / 3; grid-row: 2; }
  #cards.layout-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; --scale: 0.52; }

  .card {
    position: relative;
    padding: calc(var(--scale) * 36px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    background: #11151f; /* flat, opaque cockpit cell — no gradient, no blur, no shadow */
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: calc(var(--scale) * 20px);
  }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .title {
    font-size: calc(var(--scale) * 32px);
    font-weight: 700;
    color: #e6e9ef;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: calc(var(--scale) * 10px);
  }

  .status-badge {
    font-size: calc(var(--scale) * 13px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: calc(var(--scale) * 4px) calc(var(--scale) * 10px);
    border-radius: calc(var(--scale) * 20px);
    background: color-mix(in srgb, var(--accent) 15%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
  }

  .route-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .route-block {
    display: flex;
    flex-direction: column;
  }

  .route-block.right {
    align-items: flex-end;
  }

  .route-plane {
    font-size: calc(var(--scale) * 28px);
    color: #565f89;
    transform: rotate(0deg);
    align-self: center;
    margin-bottom: calc(var(--scale) * 18px);
  }

  .iata {
    font-size: calc(var(--scale) * 76px);
    font-weight: 800;
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: #e6e9ef; /* solid — emphasis comes from weight/size, not gradient text */
  }

  .time {
    font-size: calc(var(--scale) * 18px);
    color: #8089a6;
    font-weight: 500;
    margin-top: calc(var(--scale) * 6px);
  }

  .time span {
    font-family: var(--mono);
    color: #e6e9ef;
    font-weight: 600;
  }

  /* Enhanced Route Progress Bar */
  .bar-container {
    padding: calc(var(--scale) * 8px) 0;
  }

  .bar-wrap {
    position: relative;
    height: calc(var(--scale) * 4px);
    background: rgba(255, 255, 255, 0.12);
    border-radius: 99px;
  }

  .bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--accent); /* flat fill — no gradient, no glow */
    border-radius: 99px;
  }

  .bar-dot {
    position: absolute;
    top: 50%;
    width: calc(var(--scale) * 8px);
    height: calc(var(--scale) * 8px);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
  }

  .bar-dot.start { background: var(--accent); }
  .bar-dot.end { background: #565f89; }

  .bar-plane {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%) rotate(0deg);
    font-size: calc(var(--scale) * 26px);
    color: var(--accent); /* flat — no glow */
    z-index: 3;
    transition: left 0.5s ease;
  }

  /* Telemetry Stats Grid */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: calc(var(--scale) * 12px);
  }

  .stat-card {
    background: #0b0e14;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: calc(var(--scale) * 10px);
    padding: calc(var(--scale) * 12px);
  }

  .stat-label {
    font-size: max(11px, calc(var(--scale) * 12px));
    color: #565f89;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: calc(var(--scale) * 4px);
  }

  .stat-value {
    font-family: var(--mono); /* live telemetry — Mono Numerals Rule */
    font-size: max(14px, calc(var(--scale) * 22px)); /* Fourteen-Pixel Floor, even at max density */
    font-weight: 600;
    color: #e6e9ef;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .center-msg {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-size: calc(var(--scale) * 22px);
    color: #565f89;
    font-weight: 500;
  }

  .error-msg {
    position: absolute;
    bottom: calc(var(--scale) * 12px);
    left: calc(var(--scale) * 36px);
    font-size: max(14px, calc(var(--scale) * 13px));
    color: #f7768e; /* Panel Red — genuine error state */
    font-weight: 500;
  }
</style>
</head>
<body>
<div id="cards"></div>
<script src="flights.js"></script>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';
  const { parseCodes, parseFlight, fmtTime, routeProgress } = globalThis.Flights;

  function escapeHtml(str) {
    if (typeof str !== "string") return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  const defaults = { flightCodes: "UA804", accentColor: "#7aa2f7" };
  let cfg = Object.assign({}, defaults);
  let codes = [];
  let flightsByCode = {};
  let errorByCode = {};
  let loading = true;

  function buildUrl(code) {
    return `https://aerodatabox.p.rapidapi.com/flights/number/${encodeURIComponent(code)}?withLocation=true`;
  }

  async function fetchOne(code) {
    try {
      const res = await xemd.proxy.fetch(buildUrl(code), {
        headers: {
          "X-RapidAPI-Key": "{{secret:AERODATABOX_KEY}}",
          "X-RapidAPI-Host": "aerodatabox.p.rapidapi.com",
        },
      });
      if (res.ok) {
        flightsByCode[code] = parseFlight(await res.json());
        errorByCode[code] = null;
      } else {
        errorByCode[code] = `HTTP ${res.status}`;
      }
    } catch (err) {
      errorByCode[code] = "offline";
    }
  }

  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  // One fetch per configured flight per refresh tick — AeroDataBox/RapidAPI
  // free tiers meter per-minute and per-month. Sequential with a stagger
  // (not Promise.all) — firing all 4 at once can trip a per-second burst
  // limit even when the daily/monthly quota has plenty of room left.
  async function refresh() {
    codes = parseCodes(cfg.flightCodes);
    if (codes.length === 0) {
      loading = false;
      render();
      return;
    }
    for (let i = 0; i < codes.length; i++) {
      if (i > 0) await sleep(1200);
      await fetchOne(codes[i]);
      loading = false;
      render();
    }
  }

  function cardHtml(code) {
    const flight = flightsByCode[code];
    const err = errorByCode[code];
    const title = escapeHtml((flight && flight.airline) ? `${flight.airline} ${code}` : code);

    if (!flight) {
      return `<div class="card">
        <div class="header-row">
          <div class="title">${title}</div>
        </div>
        <div class="center-msg">${escapeHtml(err ? `${code} — ${err}` : "Loading…")}</div>
      </div>`;
    }

    const progress = routeProgress(flight.depLatLon, flight.arrLatLon, flight.curLatLon);
    const progressPercent = progress != null ? (progress * 100).toFixed(1) : 0;

    const planeHtml = progress == null ? "" :
      `<div class="bar-plane" style="left:${progressPercent}%">✈</div>`;

    const fillStyle = progress == null ? 'style="width:0%"' : `style="width:${progressPercent}%"`;
    const statusText = flight.status ? escapeHtml(flight.status) : "En Route";

    return `<div class="card">
      <div class="header-row">
        <div class="title">${title}</div>
        <div class="status-badge">${statusText}</div>
      </div>

      <div class="route-row">
        <div class="route-block">
          <div class="iata">${escapeHtml(flight.depIata)}</div>
          <div class="time">Dep <span>${fmtTime(flight.depTime)}</span></div>
        </div>
        <div class="route-plane">✈</div>
        <div class="route-block right">
          <div class="iata">${escapeHtml(flight.arrIata)}</div>
          <div class="time">Arr <span>${fmtTime(flight.arrTime)}</span></div>
        </div>
      </div>

      <div class="bar-container">
        <div class="bar-wrap">
          <div class="bar-fill" ${fillStyle}></div>
          <div class="bar-dot start" style="left:0"></div>
          <div class="bar-dot end" style="left:100%"></div>
          ${planeHtml}
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <div class="stat-label">AIRCRAFT</div>
          <div class="stat-value">${escapeHtml(flight.aircraft || "—")}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">ALTITUDE</div>
          <div class="stat-value">${flight.altitudeFt != null ? Math.round(flight.altitudeFt).toLocaleString() + " ft" : "—"}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">SPEED</div>
          <div class="stat-value">${flight.speedKt != null ? Math.round(flight.speedKt) + " kt" : "—"}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">HEADING</div>
          <div class="stat-value">${flight.headingDeg != null ? Math.round(flight.headingDeg) + "°" : "—"}</div>
        </div>
      </div>

      ${err ? `<div class="error-msg">${escapeHtml(err)}</div>` : ""}
    </div>`;
  }

  function render() {
    document.body.style.setProperty("--accent", cfg.accentColor || defaults.accentColor);

    const container = document.getElementById("cards");
    if (codes.length === 0) {
      container.className = "layout-1";
      container.innerHTML = `<div class="center-msg">${
        loading ? "Loading…" : "Add flight codes and an API key in Settings"
      }</div>`;
      return;
    }
    container.className = `layout-${codes.length}`;
    container.innerHTML = codes.map(cardHtml).join("");
  }

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    codes = parseCodes(cfg.flightCodes);
    render();
    refresh();
  });

  xemd.onRefresh(refresh);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    render();
    refresh();
  });

  xemd.ready();
</script>
</body>
</html>
