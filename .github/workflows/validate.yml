name: validate
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs: this account sets sha_pinning_required,
      # and a bare @v4 tag fails the run at startup.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Every widget folder (anything with a manifest.json) must validate with no errors or warnings.
      - run: find . -maxdepth 2 -name manifest.json -not -path './.*' -exec dirname {} \; | sort | xargs node validate.mjs --strict
      # The validator's own tests, plus each widget's own tests.
      - run: node --test tools/validate.test.mjs
      - run: node --test "*/*.test.mjs"
