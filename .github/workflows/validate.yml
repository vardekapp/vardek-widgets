name: validate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every widget folder (anything with a manifest.json) must validate with no errors or warnings.
      - run: find . -maxdepth 2 -name manifest.json -not -path './.*' -exec dirname {} \; | sort | xargs node validate.mjs --strict
      # The validator's own tests, plus each widget's own tests.
      - run: node --test tools/validate.test.mjs
      - run: node --test "*/*.test.mjs"
