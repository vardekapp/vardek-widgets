<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  #map { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="map" width="2560" height="720"></canvas>
<script src="land.js"></script>
<script src="satellite.min.js"></script>
<script src="iss.js"></script>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';

  const W = 2560, H = 720;
  const TLE_URL = "https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=tle";
  const TRAIL_MS = 45 * 60000;
  const PROJECTION_MS = 90 * 60000;
  const STEP_MS = 60000;
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const { project, parseTLE, subpoint, groundTrack } = globalThis.ISS;

  const defaults = { showLand: true, showTrail: true, showProjection: true, units: "km" };
  let cfg = defaults;
  let satrec = null;
  let current = null;
  let errorMsg = null;
  let tickHandle = null;

  function drawOcean() {
    ctx.fillStyle = "#0b0e1a";
    ctx.fillRect(0, 0, W, H);
  }

  function drawLand() {
    if (!cfg.showLand || !Array.isArray(globalThis.LAND)) return;
    ctx.fillStyle = "#243049";
    ctx.strokeStyle = "#3a4a6b";
    ctx.lineWidth = 1;
    for (const ring of globalThis.LAND) {
      ctx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const p = project(lon, lat, W, H);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawPath(points, strokeStyle, lineWidth, dash) {
    if (points.length < 2) return;
    ctx.save();
    ctx.strokeStyle = strokeStyle;
    ctx.lineWidth = lineWidth;
    ctx.setLineDash(dash || []);
    ctx.beginPath();
    let prev = null;
    for (const pt of points) {
      const p = project(pt.lon, pt.lat, W, H);
      if (prev && Math.abs(p.x - prev.x) > W / 2) {
        // Wraps across the +/-180 seam — start a new segment instead of connecting.
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      } else if (!prev) {
        ctx.moveTo(p.x, p.y);
      } else {
        ctx.lineTo(p.x, p.y);
      }
      prev = p;
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawTrail(now) {
    if (!cfg.showTrail || !satrec) return;
    drawPath(groundTrack(satrec, now - TRAIL_MS, now, STEP_MS), "rgba(255,204,102,0.35)", 2);
  }

  function drawProjection(now) {
    if (!cfg.showProjection || !satrec) return;
    drawPath(groundTrack(satrec, now, now + PROJECTION_MS, STEP_MS), "rgba(140,190,255,0.45)", 2, [6, 6]);
  }

  function drawIss() {
    if (!current) return;
    const p = project(current.lon, current.lat, W, H);
    ctx.save();
    ctx.shadowColor = "#ffcc66";
    ctx.shadowBlur = 16;
    // Central body
    ctx.fillStyle = "#e6e9ef";
    const bodyW = 14, bodyH = 10;
    ctx.beginPath();
    ctx.roundRect(p.x - bodyW / 2, p.y - bodyH / 2, bodyW, bodyH, 3);
    ctx.fill();
    // Solar panel wings
    ctx.fillStyle = "#ffcc66";
    const wingW = 12, wingH = 22;
    ctx.fillRect(p.x - bodyW / 2 - wingW - 2, p.y - wingH / 2, wingW, wingH);
    ctx.fillRect(p.x + bodyW / 2 + 2, p.y - wingH / 2, wingW, wingH);
    ctx.strokeStyle = "rgba(0,0,0,0.35)";
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x - bodyW / 2 - wingW - 2, p.y - wingH / 2, wingW, wingH);
    ctx.strokeRect(p.x + bodyW / 2 + 2, p.y - wingH / 2, wingW, wingH);
    ctx.restore();
  }

  function drawReadout() {
    ctx.font = "18px -apple-system, 'Helvetica Neue', sans-serif";
    ctx.textAlign = "left";
    if (errorMsg && !current) {
      ctx.fillStyle = "#8089a6";
      ctx.fillText(`ISS Tracker — ${errorMsg}`, 16, 28);
      return;
    }
    if (!current) {
      ctx.fillStyle = "#8089a6";
      ctx.fillText("ISS Tracker — acquiring TLE…", 16, 28);
      return;
    }
    const mi = cfg.units === "mi";
    const alt = mi ? current.altKm * 0.621371 : current.altKm;
    const vel = mi ? current.velKmh * 0.621371 : current.velKmh;
    const distUnit = mi ? "mi" : "km";
    const velUnit = mi ? "mph" : "km/h";
    ctx.fillStyle = "#e6e9ef";
    ctx.fillText(
      `ISS — lat ${current.lat.toFixed(2)}, lon ${current.lon.toFixed(2)} · alt ${alt.toFixed(0)} ${distUnit} · vel ${vel.toFixed(0)} ${velUnit}`,
      16, 28
    );
    if (errorMsg) {
      ctx.fillStyle = "#8089a6";
      ctx.fillText(errorMsg, 16, 50);
    }
  }

  function draw() {
    const now = Date.now();
    drawOcean();
    drawLand();
    drawTrail(now);
    drawProjection(now);
    drawIss();
    drawReadout();
  }

  function tick() {
    if (satrec) {
      current = subpoint(satrec, new Date());
    }
    draw();
  }

  async function fetchTLE() {
    try {
      const res = await xemd.proxy.fetch(TLE_URL);
      if (res.ok) {
        const tle = parseTLE(await res.text());
        if (tle) {
          satrec = globalThis.satellite.twoline2satrec(tle.l1, tle.l2);
          errorMsg = null;
        } else {
          errorMsg = "bad TLE data";
        }
      } else {
        errorMsg = `HTTP ${res.status}`;
      }
    } catch (err) {
      errorMsg = err && err.message ? err.message : "fetch failed";
    }
    tick();
  }

  // Draw an initial ocean+land map immediately so the widget is never blank.
  draw();

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    fetchTLE();
  });

  if (!tickHandle) tickHandle = setInterval(tick, 1000);

  xemd.onRefresh(fetchTLE);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
  });

  xemd.ready();
</script>
</body>
</html>
