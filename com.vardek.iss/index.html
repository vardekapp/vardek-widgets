<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #02040a;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  }
  #map { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="map" width="2560" height="720"></canvas>
<script src="land.js"></script>
<script src="satellite.min.js"></script>
<script src="iss.js"></script>
<script type="module">
  import { xemd } from '/sdk/widget-sdk.js';

  const W = 2560, H = 720;
  const TLE_URL = "https://api.wheretheiss.at/v1/satellites/25544/tles";
  const TRAIL_MS = 45 * 60000;
  const PROJECTION_MS = 90 * 60000;
  const STEP_MS = 60000;
  const canvas = document.getElementById("map");
  const ctx = canvas.getContext("2d");
  const { project, parseTLE, subpoint, groundTrack } = globalThis.ISS;

  const defaults = { showLand: true, showTrail: true, showProjection: true, units: "km" };
  let cfg = defaults;
  let satrec = null;
  let current = null;
  let errorMsg = null;
  let tickHandle = null;

  function roundRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function drawOcean() {
    const grad = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W / 1.1);
    grad.addColorStop(0, "#0b1329");
    grad.addColorStop(0.6, "#060a17");
    grad.addColorStop(1, "#02040a");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  function drawLand() {
    if (!cfg.showLand || !Array.isArray(globalThis.LAND)) return;
    ctx.fillStyle = "rgba(15, 30, 58, 0.45)";
    ctx.strokeStyle = "rgba(56, 189, 248, 0.22)";
    ctx.lineWidth = 1;

    for (const ring of globalThis.LAND) {
      ctx.beginPath();
      ring.forEach(([lon, lat], i) => {
        const p = project(lon, lat, W, H);
        if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }
  }

  function drawGraticule() {
    ctx.strokeStyle = "rgba(56, 189, 248, 0.04)";
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 12]);

    for (let lat = -60; lat <= 60; lat += 30) {
      const y = (90 - lat) / 180 * H;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    for (let lon = -150; lon <= 150; lon += 30) {
      const x = (lon + 180) / 360 * W;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    ctx.setLineDash([]);

    // Equator / Prime Meridian highlight
    ctx.strokeStyle = "rgba(56, 189, 248, 0.12)";
    ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();
  }

  function drawTrail(now) {
    if (!cfg.showTrail || !satrec) return;
    const pts = groundTrack(satrec, now - TRAIL_MS, now, STEP_MS);
    if (pts.length < 2) return;
    const proj = pts.map(p => project(p.lon, p.lat, W, H));

    for (let i = 1; i < proj.length; i++) {
      const p0 = proj[i - 1], p1 = proj[i];
      if (Math.abs(p1.x - p0.x) > W / 2) continue;
      const frac = i / (proj.length - 1);

      ctx.strokeStyle = "rgba(251, 191, 36, " + (0.05 + 0.65 * frac) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
  }

  function drawProjection(now) {
    if (!cfg.showProjection || !satrec) return;
    const pts = groundTrack(satrec, now, now + PROJECTION_MS, STEP_MS);
    if (pts.length < 2) return;

    ctx.save();
    ctx.strokeStyle = "rgba(56, 189, 248, 0.45)";
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    let prev = null;
    for (const pt of pts) {
      const p = project(pt.lon, pt.lat, W, H);
      if (prev && Math.abs(p.x - prev.x) > W / 2) {
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      } else if (!prev) {
        ctx.moveTo(p.x, p.y);
      } else {
        ctx.lineTo(p.x, p.y);
      }
      prev = p;
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawIss() {
    if (!current) return;
    const p = project(current.lon, current.lat, W, H);
    const t = Date.now() / 1000;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);

    // Glowing Radar Target Reticle
    ctx.save();

    // Outer Pulsing Target Rings
    for (let ring = 0; ring < 2; ring++) {
      const phase = ((t * 0.7 + ring * 0.5) % 1);
      const ringR = 12 + phase * 32;
      const alpha = (1 - phase) * 0.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, ringR, 0, 2 * Math.PI);
      ctx.strokeStyle = "rgba(251, 191, 36, " + alpha + ")";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Target Crosshair
    ctx.strokeStyle = "rgba(251, 191, 36, 0.6)";
    ctx.lineWidth = 1;
    const cLen = 22;
    ctx.beginPath(); ctx.moveTo(p.x - cLen, p.y); ctx.lineTo(p.x + cLen, p.y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p.x, p.y - cLen); ctx.lineTo(p.x, p.y + cLen); ctx.stroke();

    // ISS Vehicle Model
    ctx.shadowColor = "#fbbf24";
    ctx.shadowBlur = 16;

    const bodyW = 16, bodyH = 10;
    ctx.fillStyle = "#ffffff";
    roundRect(p.x - bodyW / 2, p.y - bodyH / 2, bodyW, bodyH, 3);
    ctx.fill();

    // Solar Wings
    ctx.fillStyle = "#38bdf8";
    const wingW = 14, wingH = 38;
    ctx.fillRect(p.x - bodyW / 2 - wingW - 2, p.y - wingH / 2, wingW, wingH);
    ctx.fillRect(p.x + bodyW / 2 + 2, p.y - wingH / 2, wingW, wingH);
    ctx.shadowBlur = 0;

    // Solar Wing Grids
    ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
    ctx.lineWidth = 1;
    ctx.strokeRect(p.x - bodyW / 2 - wingW - 2, p.y - wingH / 2, wingW, wingH);
    ctx.strokeRect(p.x + bodyW / 2 + 2, p.y - wingH / 2, wingW, wingH);

    ctx.restore();
  }

  function drawTitle() {
    const boxX = 24, boxY = 24, boxW = 320, boxH = 68;

    // Glass panel
    const grad = ctx.createLinearGradient(boxX, boxY, boxX, boxY + boxH);
    grad.addColorStop(0, "rgba(15, 23, 42, 0.85)");
    grad.addColorStop(1, "rgba(3, 7, 18, 0.90)");

    ctx.fillStyle = grad;
    roundRect(boxX, boxY, boxW, boxH, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
    ctx.lineWidth = 1.5;
    roundRect(boxX, boxY, boxW, boxH, 12);
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    // Title text
    ctx.font = "800 20px -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif";
    ctx.fillStyle = "#f8fafc";
    ctx.fillText("ISS TRACKER", boxX + 18, boxY + 24);

    // Live Indicator Pulse
    const liveX = boxX + boxW - 24, liveY = boxY + 24;
    const t = Date.now() / 1000;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);

    ctx.beginPath();
    ctx.arc(liveX, liveY, 4, 0, 2 * Math.PI);
    ctx.fillStyle = "#34d399";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(liveX, liveY, 4 + pulse * 4, 0, 2 * Math.PI);
    ctx.strokeStyle = "rgba(52, 211, 153, " + (0.6 - pulse * 0.4) + ")";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Subtitle / Status
    ctx.font = "600 12px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.fillStyle = "#94a3b8";
    if (errorMsg) {
      ctx.fillStyle = "#f87171";
      ctx.fillText(errorMsg, boxX + 18, boxY + 46);
    } else {
      ctx.fillText("REAL-TIME ORBITAL TELEMETRY", boxX + 18, boxY + 46);
    }
  }

  function drawHud() {
    if (!current) return;
    const mi = cfg.units === "mi";
    const alt = mi ? current.altKm * 0.621371 : current.altKm;
    const vel = mi ? current.velKmh * 0.621371 : current.velKmh;
    const distUnit = mi ? "mi" : "km";
    const velUnit = mi ? "mph" : "km/h";

    const px = 24, py = H - 156, pw = 360, ph = 132;

    const grad = ctx.createLinearGradient(px, py, px, py + ph);
    grad.addColorStop(0, "rgba(15, 23, 42, 0.88)");
    grad.addColorStop(1, "rgba(3, 7, 18, 0.94)");

    ctx.fillStyle = grad;
    roundRect(px, py, pw, ph, 12);
    ctx.fill();
    ctx.strokeStyle = "rgba(56, 189, 248, 0.20)";
    ctx.lineWidth = 1.5;
    roundRect(px, py, pw, ph, 12);
    ctx.stroke();

    const lx = px + 18, rx = px + pw - 18;
    let y = py + 24;
    const sp = 25;
    ctx.font = "600 14px -apple-system, BlinkMacSystemFont, sans-serif";

    function hudRow(label, value, valueColor) {
      ctx.fillStyle = "#64748b";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText(label, lx, y);
      ctx.fillStyle = valueColor;
      ctx.textAlign = "right";
      ctx.fillText(value, rx, y);
      y += sp;
    }

    const latDir = current.lat >= 0 ? "N" : "S";
    const lonDir = current.lon >= 0 ? "E" : "W";
    hudRow("LATITUDE", Math.abs(current.lat).toFixed(2) + "° " + latDir, "#f8fafc");
    hudRow("LONGITUDE", Math.abs(current.lon).toFixed(2) + "° " + lonDir, "#f8fafc");
    hudRow("ALTITUDE", alt.toFixed(1) + " " + distUnit, "#38bdf8");
    hudRow("VELOCITY", Math.round(vel).toLocaleString("en") + " " + velUnit, "#fbbf24");
  }

  function drawLegend() {
    if (!satrec) return;
    const boxW = 220, boxH = 64;
    const lx = W - boxW - 24, ly = H - boxH - 24;

    const grad = ctx.createLinearGradient(lx, ly, lx, ly + boxH);
    grad.addColorStop(0, "rgba(15, 23, 42, 0.85)");
    grad.addColorStop(1, "rgba(3, 7, 18, 0.90)");

    ctx.fillStyle = grad;
    roundRect(lx, ly, boxW, boxH, 10);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
    ctx.lineWidth = 1;
    roundRect(lx, ly, boxW, boxH, 10);
    ctx.stroke();

    ctx.font = "600 12px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";

    if (cfg.showTrail) {
      ctx.strokeStyle = "#fbbf24";
      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(lx + 16, ly + 22); ctx.lineTo(lx + 40, ly + 22); ctx.stroke();
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("PAST TRAIL (45 MIN)", lx + 48, ly + 22);
    }

    if (cfg.showProjection) {
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(lx + 16, ly + 44); ctx.lineTo(lx + 40, ly + 44); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#cbd5e1";
      ctx.fillText("PROJECTED (90 MIN)", lx + 48, ly + 44);
    }
  }

  function draw() {
    const now = Date.now();
    drawOcean();
    drawLand();
    drawGraticule();
    drawTrail(now);
    drawProjection(now);
    drawIss();
    drawTitle();
    drawHud();
    drawLegend();
  }

  function tick() {
    if (satrec) {
      current = subpoint(satrec, new Date());
    }
    draw();
  }

  async function fetchTLE() {
    try {
      const res = await xemd.proxy.fetch(TLE_URL);
      if (res.ok) {
        const j = await res.json();
        if (j && j.line1 && j.line2) {
          satrec = globalThis.satellite.twoline2satrec(j.line1, j.line2);
          errorMsg = null;
        } else {
          errorMsg = "BAD TLE DATA";
        }
      } else {
        errorMsg = `HTTP ${res.status}`;
      }
    } catch (err) {
      errorMsg = err && err.message ? err.message : "FETCH FAILED";
    }
    tick();
  }

  draw();

  xemd.settings.get().then(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
    fetchTLE();
  });

  if (!tickHandle) tickHandle = setInterval(tick, 200);

  xemd.onRefresh(fetchTLE);
  xemd.onSettingsChange(s => {
    cfg = Object.assign({}, defaults, s);
    draw();
  });

  xemd.ready();
</script>
</body>
</html>
